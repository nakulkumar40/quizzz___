<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div class="max-w-md mx-auto mt-10 p-6 border border-gray-300 rounded-md">
        <h2 class="text-2xl font-bold text-center mb-6">Create an Account</h2>
        <form action="signup.php" method="POST" class="space-y-4">
            <!-- Full Name -->
            <div>
                <label for="signup-name" class="block text-gray-700 mb-1">Full Name</label>
                <input type="text" id="signup-name" name="name" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-accent" required>
            </div>

            <!-- Email -->
            <div>
                <label for="signup-email" class="block text-gray-700 mb-1">Email</label>
                <input type="email" id="signup-email" name="email" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-accent" required>
            </div>

            <!-- Password -->
            <div>
                <label for="signup-password" class="block text-gray-700 mb-1">Password</label>
                <input type="password" id="signup-password" name="password" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-accent" required>
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="signup-confirm" class="block text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="signup-confirm" name="confirm_password" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-accent" required>
            </div>

            <!-- Terms and Conditions -->
            <div class="flex items-center">
                <input type="checkbox" id="terms" name="terms" class="h-4 w-4 text-accent focus:ring-accent border-gray-300 rounded" required>
                <label for="terms" class="ml-2 block text-sm text-gray-700">I agree to the <a href="#" class="text-primary hover:text-secondary">Terms and Conditions</a></label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-light py-2 rounded-md font-semibold transition">Sign Up</button>

            <!-- Login Link -->
            <div class="text-center text-sm text-gray-600">
                Already have an account? <a href="#login-modal" id="show-login" class="text-primary hover:text-secondary font-semibold">Login</a>
            </div>
        </form>
    </div>
</body>
</html>
